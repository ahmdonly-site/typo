:root{--bg:#f4f1ea;--card:#fff;--ink:#14110d;--mut:#5b5348;--line:#14110d;--on:#14110d;--onfg:#fff;--acc:#b4531a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d10;--card:#17171c;--ink:#f7f3ea;--mut:#b4ad9f;--line:#f7f3ea;--on:#ffcf5a;--onfg:#14110d;--acc:#ffcf5a}}
:root[data-theme="dark"]{--bg:#0d0d10;--card:#17171c;--ink:#f7f3ea;--mut:#b4ad9f;--line:#f7f3ea;--on:#ffcf5a;--onfg:#14110d;--acc:#ffcf5a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"SF Pro Text","Segoe UI",Tahoma,sans-serif;-webkit-text-size-adjust:100%;touch-action:manipulation}
main{max-width:560px;margin:0 auto;padding:14px 14px 28px;display:flex;flex-direction:column;gap:14px}
header{display:flex;justify-content:space-between;align-items:center}
h1{font-size:18px;margin:0}h1 small{display:block;font-size:12px;font-weight:500;color:var(--mut);direction:ltr;text-align:right}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px}
#stage{min-height:min(52vh,320px);display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
#txt{font-family:BTypo,serif;white-space:pre;direction:rtl;line-height:1.5;text-align:center;font-kerning:normal;text-rendering:optimizeLegibility;color:var(--ink)}
h2{font-size:14px;margin:0 0 10px;color:var(--mut);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button{font:inherit;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:14px;min-height:52px;min-width:44px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;line-height:1.2}
button b{font-size:15px}button i{font-style:normal;font-size:11px;opacity:.75;direction:ltr}
button[aria-pressed="true"]{background:var(--on);color:var(--onfg);border-color:var(--on)}
button:active{transform:scale(.97)}
.row{display:flex;align-items:center;gap:10px;direction:ltr}
.row button{flex:0 0 52px;font-size:24px;min-height:52px}
input[type=range]{flex:1;min-height:44px;accent-color:var(--acc);margin:0}
#kv{min-width:28px;text-align:center;font-weight:700;font-size:18px}
#exp{background:var(--acc);color:var(--onfg);border-color:var(--acc);min-height:60px;font-size:18px;flex-direction:row;gap:10px}
:root:not([data-theme="dark"]) #exp{color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) #exp{color:#14110d}}
#reset{min-height:44px;font-size:14px;border-style:dashed;flex-direction:row}
